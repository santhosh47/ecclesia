# Render Blueprint Specification for Ecclesia Church Management System
# Docs: https://render.com/docs/blueprint-spec

version: "1"

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: ecclesia-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: "Ecclesia Church Platform"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "*"
      # Connect to Render managed Postgres (or set DATABASE_URL manually)
      - key: DATABASE_URL
        fromDatabase:
          name: ecclesia-db
          property: connectionString

  # ---------------------------------------------------------------------------
  # 2. React Admin Portal (Static SPA)
  # ---------------------------------------------------------------------------
  - type: static_site
    name: ecclesia-admin-portal
    region: oregon
    plan: free
    buildCommand: "cd admin-portal && npm install && npm run build"
    publishPath: "admin-portal/dist"
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ecclesia-backend.onrender.com/api/v1

databases:
  # ---------------------------------------------------------------------------
  # 3. PostgreSQL Database (Free Tier)
  # ---------------------------------------------------------------------------
  - name: ecclesia-db
    region: oregon
    plan: free
    databaseName: ecclesia
    user: ecclesia
